<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmoMem · 封面</title>
<style>
  /* 一屏一个主导物：标题独占视觉重量，其余元素加起来不超过 4 个 */
  @page { size: A4 portrait; margin: 0; }
  :root{
    --ink:#EDF2FA;         /* 柔白，不是 #fff on #000 */
    --muted:#A9B6CC;       /* 暖灰，不是纯灰 */
    --accent:#E0A458;      /* 和界面同一个强调色 */
    --scrim:rgba(5,12,32,.55);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:210mm; height:297mm; }
  body{
    background:#050F2B url("template.jpg") center center / cover no-repeat;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
    font-family:"Source Han Sans SC","Noto Sans SC","Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    color:var(--ink);
    overflow:hidden;
  }
  .page{ position:relative; width:210mm; height:297mm; }

  /* 只在文字区压暗（照片上的中性 scrim 是允许的唯一"遮罩"），顶栏与底部 logo 不碰 */
  .scrim{
    position:absolute; left:0; right:0; top:24mm; bottom:34mm;
    background:linear-gradient(180deg, rgba(5,12,32,0) 0%, var(--scrim) 22%, var(--scrim) 74%, rgba(5,12,32,0) 100%);
    pointer-events:none;
  }

  .content{
    position:absolute; left:22mm; right:22mm; top:112mm;
  }

  h1{
    font-size:76pt; line-height:.98; font-weight:600; letter-spacing:-.03em;
    color:var(--ink);
  }
  .who{
    margin-top:7mm; font-size:15pt; line-height:1.5; color:var(--muted); letter-spacing:.01em;
  }
  .tagline{
    margin-top:5mm; font-size:21pt; line-height:1.55; font-weight:500; color:var(--ink);
  }

  .rule{ margin:11mm 0 5mm; width:26mm; height:1px; background:var(--accent); }

  .sign{
    font-size:9.5pt; line-height:1.7; color:var(--muted); letter-spacing:.02em;
  }
</style>
</head>
<body>
<div class="page">
  <div class="scrim"></div>

  <div class="content">
    <h1>EmoMem</h1>
    <p class="who">情感陪伴 Agent · 五层记忆 · 人设编译器</p>
    <p class="tagline">它记得住你，<br>也说得清它为什么记得。</p>
    <div class="rule"></div>
    <p class="sign">github.com/l639-lds/Emotional-Agent<br>没有 API Key 也能跑通全链路</p>
  </div>
</div>
</body>
</html>
